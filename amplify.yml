version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify build variables are not automatically available to the
        # Next.js SSR runtime. Persist only the reviewed, non-secret runtime
        # configuration required by the clinical web process.
        - env | grep -E '^(APP_EDITION|APP_RUNTIME_ENV|NEXT_PUBLIC_APP_ENV|NEXT_PUBLIC_USE_LIVE_API|CLINICAL_DATA_PLANE|CLINICAL_SUPABASE_URL|CLINICAL_SUPABASE_ANON_KEY|CLINICAL_AWS_REGION|CLINICAL_AWS_API_ORIGIN|CLINICAL_AWS_ALLOWED_API_HOSTS|CLINICAL_AWS_RUNTIME_MODE)=' > .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
