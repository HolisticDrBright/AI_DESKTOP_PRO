AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AI Desktop Pro — Phase 10B.2 clinical copilot STAGING secret and a
  least-privilege reader role. Idempotent: deploy it repeatedly with the
  same parameters and nothing changes. It creates the secret CONTAINER but
  never the secret VALUE — the value is written out-of-band by
  scripts/bootstrap-copilot-secret.ps1, which never accepts it as an
  argument and never prints it.

# ---------------------------------------------------------------------------
# WHAT THIS DELIBERATELY DOES NOT DO
#
#   · It does not put a placeholder value in the secret. A placeholder is a
#     credential-shaped object that passes every presence check and fails
#     only at the provider, which is the worst place to find out.
#   · It grants no `secretsmanager:ListSecrets`. An identity that can
#     enumerate secrets can map the account; the preflight asserts this is
#     DENIED and treats "allowed" as a misconfiguration.
#   · It uses no wildcard resource on any statement. The secret ARN is
#     pinned; the KMS grant is conditioned on ViaService so the key cannot
#     be used for anything but this secret.
#   · It grants no write. The application never writes a secret.
# ---------------------------------------------------------------------------

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging]
    Description: >-
      Staging only. `production` is deliberately absent: a production
      secret belongs in a separate account with a separate review, not
      behind a dropdown in the staging template.

  SecretName:
    Type: String
    Default: clinical/copilot/openai-staging
    AllowedPattern: "^clinical/copilot/[A-Za-z0-9/_-]+$"
    Description: Secrets Manager name. Must live under clinical/copilot/.

  ReaderPrincipalArn:
    Type: String
    Default: ""
    Description: >-
      Optional. The IAM principal (role ARN) permitted to assume the reader
      role — your server's task role, an IRSA role, or your SSO permission
      set role. Leave blank to create the role without a trust
      relationship and attach one later; the role is useless until then,
      which is the safe default.

  RotationWindowDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 365
    Description: Advisory rotation cadence, recorded as metadata.

Conditions:
  HasReaderPrincipal: !Not [!Equals [!Ref ReaderPrincipalArn, ""]]

Resources:
  # -------------------------------------------------------------------------
  # A dedicated CMK. The AWS-managed key would work, but a dedicated key is
  # what makes the `kms:ViaService` condition below meaningful and lets the
  # secret be revoked by disabling one key.
  # -------------------------------------------------------------------------
  CopilotSecretKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "AI Desktop Pro clinical copilot ${Environment} secret CMK"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountRootAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowSecretsManagerUseOfTheKey
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
      Tags:
        - Key: Application
          Value: ai-desktop-pro
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClass
          Value: credential-no-phi

  CopilotSecretKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/clinical-copilot-${Environment}"
      TargetKeyId: !Ref CopilotSecretKey

  # -------------------------------------------------------------------------
  # The secret CONTAINER. No SecretString and no GenerateSecretString: an
  # OpenAI key cannot be generated by AWS, and a generated placeholder
  # would be a value that looks real to every check until the first call.
  # -------------------------------------------------------------------------
  CopilotOpenAiSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref SecretName
      Description: >-
        OpenAI project-scoped API key for the AI Desktop Pro clinical
        copilot, staging. Value written out of band. Either an opaque
        bearer, or JSON with ONLY apiKey / organization / project — any
        other field is refused by the application's parser.
      KmsKeyId: !Ref CopilotSecretKey
      Tags:
        - Key: Application
          Value: ai-desktop-pro
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClass
          Value: credential-no-phi
        - Key: RotationWindowDays
          Value: !Ref RotationWindowDays
        - Key: RotationOwner
          Value: platform-security
        - Key: ContainsPhi
          Value: "false"

  # -------------------------------------------------------------------------
  # A resource policy on the secret itself, so the grant is enforced from
  # BOTH sides. An over-broad identity policy elsewhere in the account
  # still cannot read this secret unless it is the reader role.
  # -------------------------------------------------------------------------
  CopilotSecretResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Condition: HasReaderPrincipal
    Properties:
      SecretId: !Ref CopilotOpenAiSecret
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: OnlyTheReaderRoleMayRead
            Effect: Deny
            Principal: "*"
            Action: "secretsmanager:GetSecretValue"
            Resource: "*"
            Condition:
              StringNotEquals:
                aws:PrincipalArn:
                  - !GetAtt CopilotSecretReaderRole.Arn
                  - !Sub "arn:aws:iam::${AWS::AccountId}:root"

  # -------------------------------------------------------------------------
  # The reader role. Exactly two actions, exactly two pinned resources.
  # -------------------------------------------------------------------------
  CopilotSecretReaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "clinical-copilot-${Environment}-secret-reader"
      Description: Reads exactly one Secrets Manager secret. No list, no write.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - !If
            - HasReaderPrincipal
            - Effect: Allow
              Principal:
                AWS: !Ref ReaderPrincipalArn
              Action: sts:AssumeRole
            # No trust relationship until a principal is supplied. The role
            # exists and is assumable by nobody, which is the safe default.
            - Effect: Deny
              Principal:
                AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
              Action: sts:AssumeRole
      Policies:
        - PolicyName: read-one-copilot-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadTheOneCopilotSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref CopilotOpenAiSecret
              - Sid: DecryptWithTheSecretsKeyOnly
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !GetAtt CopilotSecretKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
              # Enumeration is denied EXPLICITLY, not merely unlisted, so a
              # future broad managed policy attached by mistake cannot
              # re-grant it. The preflight asserts this denial holds.
              - Sid: NeverEnumerateSecrets
                Effect: Deny
                Action:
                  - secretsmanager:ListSecrets
                  - secretsmanager:BatchGetSecretValue
                Resource: "*"
              - Sid: NeverWriteOrDeleteAnySecret
                Effect: Deny
                Action:
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:CreateSecret
                  - secretsmanager:RestoreSecret
                  - secretsmanager:ReplicateSecretToRegions
                Resource: "*"
      Tags:
        - Key: Application
          Value: ai-desktop-pro
        - Key: Environment
          Value: !Ref Environment

Outputs:
  SecretArn:
    Description: >-
      Record this on the provider registry row via register_copilot_provider.
      The ARN, never the value.
    Value: !Ref CopilotOpenAiSecret
    Export:
      Name: !Sub "${AWS::StackName}-SecretArn"

  ReaderRoleArn:
    Description: Attach to the server runtime via the standard credential chain.
    Value: !GetAtt CopilotSecretReaderRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ReaderRoleArn"

  KmsKeyArn:
    Description: Disable this key to revoke access without deleting audit history.
    Value: !GetAtt CopilotSecretKey.Arn

  Region:
    Description: Set as CLINICAL_COPILOT_AWS_REGION on the server runtime.
    Value: !Ref AWS::Region
