# Lead campaigns: an OVERLAY for Dittofeed's own docker-compose.lite.yaml at release v0.23.0
# (https://github.com/dittofeed/dittofeed/blob/v0.23.0/docker-compose.lite.yaml, MIT). Dittofeed's
# file is fetched from that pinned release by the operator; none of it is copied here.
# Design and source only: not deployed, no AWS resource, DNS name, vendor account or list exists.
#
# Use:  docker compose -f docker-compose.lite.yaml -f compose.override.yaml up
#
# - The Dittofeed dashboard listens on localhost only (reach it over a private tunnel or VPN, never
#   the internet). The only open-source sign-in is one shared password (AUTH_MODE single-tenant).
# - Only the lead-signup service is public, behind a TLS proxy: /signup, /confirm. Its
#   /internal/counts is for the Desktop over a private network and needs a bearer token.
# - Dittofeed's SES webhook (/api/public/webhooks/amazon-ses) must be reachable by SNS; expose that
#   one path through the proxy and nothing else of Dittofeed.
# - Neither service has credentials for, or a network path to, the clinical API or clinical stores.
# - Service names below (lite, and its postgres, temporal and clickhouse-server dependencies) are
#   those of the upstream file at v0.23.0 as read on 2026-10-13; verify before first use.
services:
  lite:
    image: dittofeed/dittofeed-lite:v0.23.0
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      AUTH_MODE: single-tenant
      # Required: the upstream defaults ("password") must never run.
      PASSWORD: ${DITTOFEED_DASHBOARD_PASSWORD:?set a long dashboard password}
      SECRET_KEY: ${DITTOFEED_SECRET_KEY:?set a 32-byte base64 secret}
  lead-signup:
    # Built from this repository's src/lead-signup/ (server.ts); the build recipe is Codex's.
    image: ${LEAD_SIGNUP_IMAGE:?set the reviewed lead-signup image}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - lite
    environment:
      LEAD_SIGNUP_PUBLIC_ORIGIN: ${LEAD_SIGNUP_PUBLIC_ORIGIN:?}
      LEAD_SIGNUP_LINK_KEY: ${LEAD_SIGNUP_LINK_KEY:?}
      LEAD_SIGNUP_ID_KEY: ${LEAD_SIGNUP_ID_KEY:?}
      LEAD_SIGNUP_STATS_TOKEN: ${LEAD_SIGNUP_STATS_TOKEN:?}
      DITTOFEED_INTERNAL_URL: http://lite:3000
      DITTOFEED_WORKSPACE_ID: ${DITTOFEED_WORKSPACE_ID:?}
      DITTOFEED_WRITE_KEY: ${DITTOFEED_WRITE_KEY:?}
      DITTOFEED_ADMIN_KEY: ${DITTOFEED_ADMIN_KEY:?}
      DITTOFEED_GROUP_LONGEVITY_PROGRAM: ${DITTOFEED_GROUP_LONGEVITY_PROGRAM:?}
      DITTOFEED_GROUP_WEIGHT_LOSS_PEPTIDE_PROGRAM: ${DITTOFEED_GROUP_WEIGHT_LOSS_PEPTIDE_PROGRAM:?}
      DITTOFEED_GROUP_DIABETES_PROGRAM: ${DITTOFEED_GROUP_DIABETES_PROGRAM:?}
      LEAD_SES_REGION: ${LEAD_SES_REGION:?}
      LEAD_SES_SENDER: ${LEAD_SES_SENDER:?}
      LEAD_SES_CONFIGURATION_SET: ${LEAD_SES_CONFIGURATION_SET:?}
      LEAD_SENDER_NAME: ${LEAD_SENDER_NAME:?}
      LEAD_MAILING_ADDRESS: ${LEAD_MAILING_ADDRESS:?}
