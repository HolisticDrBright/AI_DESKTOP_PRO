name: CI

on:
  push:
    branches: [main, "claude/**", "agent/**"]
  pull_request:

# This repository builds the CLINICAL edition only. Every job that builds the
# app does so with an explicit APP_EDITION=clinical, and the checks job proves
# the two refusal gates (no edition / demo edition) still hold.

jobs:
  e2e-aws-recording-consent:
    name: Browser suite (AWS recording controls, generated audio and cookie refusal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify generated browser audio with fictional AWS responses; no real patient audio
        run: |
          node scripts/live-stub-server.mjs &
          E2E_RECORDING_AWS=1 E2E_DEV_SERVER=1 APP_EDITION=clinical \
          NEXT_PUBLIC_USE_LIVE_API=true CLINICAL_CONTRACT_FIXTURE=1 \
          TRPC_BASE_URL=http://127.0.0.1:3999/api/trpc \
          CLINICAL_SUPABASE_URL=http://127.0.0.1:3999 CLINICAL_SUPABASE_ANON_KEY=stub \
          CLINICAL_DEMO_EMAIL=demo@local CLINICAL_DEMO_PASSWORD=demo CLINICAL_ORG_ID=org-fixture \
          RECORDING_AWS_API_ORIGIN=https://abcdefghij.execute-api.us-east-2.amazonaws.com \
          RECORDING_CLEANUP_EXECUTION_UI=enabled RECORDING_CLEANUP_EXECUTION_API_ORIGIN=https://abcdefghij.execute-api.us-east-2.amazonaws.com \
          npm run test:e2e -- e2e/aws-recording-consent.spec.ts e2e/aws-recording-capture.spec.ts e2e/aws-recording-cleanup-review.spec.ts e2e/aws-recording-cleanup-execution.spec.ts e2e/aws-recording-transcription.spec.ts --trace retain-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-recording-consent-browser-evidence
          path: test-results/
  # Existing fixture recording suites retain their own isolated runtime.
  checks:
    name: Typecheck, lint, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build:lab-range-tools
      - name: Build read-only retained-lab privacy operator (no AWS calls)
        run: node scripts/build-lab-privacy-inventory.mjs
      - name: AWS clinical-core synthetic safety gate
        run: npm run check:aws-clinical-core
      - name: AWS identity, invitation, and consent safety gate
        run: npm run check:aws-identity-consent
      - name: AWS authenticated synthetic API safety gate
        run: npm run check:aws-authenticated-api
      - name: AWS deployed synthetic acceptance harness gate
        run: npm run check:aws-deployment-acceptance
      - name: AWS governed catalog and read API safety gates
        run: |
          npm run check:aws-governed-catalog
          npm run check:aws-governed-catalog-api
      - name: CloudFormation schema and reference lint
        run: |
          pip install --disable-pip-version-check --quiet cfn-lint==1.55.0
          cfn-lint infra/aws-clinical-core/template.json infra/aws-clinical-core/identity-api-extension.json infra/aws-clinical-core/catalog-api-extension.json infra/aws-clinical-core/production-readiness-workload.json infra/aws-clinical-core/production-clinical-api-disabled.json infra/aws-clinical-core/production-clinical-api-candidate.json
      - name: Build and validate independent voice deployment candidate (no deployment)
        run: |
          node scripts/build-aws-owned-voice.mjs
          cfn-lint dist/aws-clinical-core/owned-voice/template.json
      - name: Build and validate independent lab processing candidate (no deployment)
        run: |
          node scripts/build-aws-owned-lab.mjs
          cfn-lint dist/aws-clinical-core/owned-lab/template.json
      - name: Build the authenticated API Lambda artifact
        run: npm run build:aws-authenticated-api
      - name: Build governed catalog and deployment artifacts
        run: |
          npm run build:aws-governed-catalog-api
          npm run build:aws-deployment-tools
          npm run build:aws-chat-transcription
          node scripts/build-aws-personal-storage.mjs
          node scripts/build-aws-privacy-operations.mjs
          cfn-lint dist/aws-clinical-core/privacy-operations/template.json
          cfn-lint dist/aws-clinical-core/personal-storage/disabled-template.json dist/aws-clinical-core/personal-storage/template.json
          npm run check:aws-chat-transcription
      - name: Qualification target runner (syntax and pre-network name refusals, no AWS calls)
        shell: pwsh
        run: ./scripts/test-qualification-runner.ps1
      - name: Hosted acceptance runners bind to the qualification target (no AWS calls)
        shell: pwsh
        run: ./scripts/test-qualification-acceptance-runners.ps1
      - name: Build and validate the six recording candidates (no deployment)
        run: |
          for mode in "" --capture --cleanup-review --cleanup-execution --transcription --drafting; do node scripts/build-aws-recording-authority.mjs $mode; done
          cfn-lint dist/aws-clinical-core/recording-authority/template.json dist/aws-clinical-core/recording-capture/template.json dist/aws-clinical-core/recording-cleanup-review/template.json dist/aws-clinical-core/recording-cleanup-execution/template.json dist/aws-clinical-core/recording-transcription/template.json dist/aws-clinical-core/recording-drafting/template.json
      - name: Qualification parameter examples match their templates
        run: npm run check:aws-qualification-parameters
      - name: Qualification target example is a valid shape and is refused as a run target
        run: npm run check:aws-qualification-target
      - name: AWS production provider-removal and foundation gates
        run: |
          npm run check:aws-data-plane-migration
          npm run check:aws-desktop-compatibility-contract
          npm run check:aws-desktop-operation-inventory
          npm run check:aws-core-launch-scope
          npm run check:aws-production-clinical-core
          npm run check:aws-covered-entity-coverage
          npm run check:aws-production-clinical-api
          npm run check:aws-production-closed-boundary-exercise
          npm run check:aws-production-pitr-recovery-exercise
          npm run build:aws-production-clinical-api
          npm run build:aws-production-rollback-acceptance
          npm run build:aws-production-clinical-core-verifier
          npm run build:aws-production-migration-operator
          npm run build:aws-model-vendor-authority-operator
          npm run build:aws-covered-entity-deletion-operator
          npm run build:aws-production-foundation
          npm run check:aws-production-foundation
          npm run test:aws-production-foundation
          npm run test:aws-production-readiness
          npm run check:aws-production-container
          npm run check:aws-production-readiness-workload
          npm run check:aws-provider-configuration
          npm run test:aws-provider-configuration
          npm run check:aws-application-rollback
          npm run test:aws-load-qualification
          npm run qualify:load-plan
      - name: Credential-free security qualification (source evidence, not a hosted test)
        run: |
          npm run build:security-qualification
          npm run qualify:security
      - name: Mock-import graph (no production path to fixtures)
        run: npm run check:mock-imports
      - name: Build refuses without an explicit edition
        run: |
          if npm run build; then
            echo "::error::npm run build must refuse when APP_EDITION is unset"
            exit 1
          fi
      - name: Build refuses the demo edition
        run: |
          if APP_EDITION=demo npm run build; then
            echo "::error::this distribution must refuse APP_EDITION=demo"
            exit 1
          fi
      - name: Clinical production build
        run: npm run build:clinical
      - name: Strict client-bundle scan (no fixture identity)
        run: npm run check:clinical-bundle

  e2e-clinical-down:
    name: Browser suite (clinical backend-down)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:clinical
      - name: Honest refusals against a DOWN backend (no process started — that is the point)
        run: |
          E2E_CLINICAL_DOWN=1 \
          APP_EDITION=clinical \
          CLINICAL_SUPABASE_URL=http://127.0.0.1:59999 \
          CLINICAL_SUPABASE_ANON_KEY=stub \
          CLINICAL_ORG_ID=org-fixture \
          npm run test:e2e -- clinical-edition

  e2e-live-fixture:
    name: Browser suite (live mode vs contract fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:clinical
      - name: Run every live suite against the committed contract fixture
        env:
          # Full single-process suite: reserve >=4 GiB for Chromium, OS and
          # native allocations. The config refuses undersized/cgroup runners.
          E2E_DEV_HEAP_MB: "10240"
          E2E_RECORDING_DIAGNOSTICS: "1"
        run: |
          node scripts/live-stub-server.mjs &
          sleep 2
          E2E_LIVE=1 \
          E2E_DEV_SERVER=1 \
          APP_EDITION=clinical \
          CLINICAL_CONTRACT_FIXTURE=1 \
          TRPC_BASE_URL=http://127.0.0.1:3999/api/trpc \
          CLINICAL_SUPABASE_URL=http://127.0.0.1:3999 \
          CLINICAL_SUPABASE_ANON_KEY=stub \
          CLINICAL_DEMO_EMAIL=demo@local \
          CLINICAL_DEMO_PASSWORD=demo \
          CLINICAL_ORG_ID=org-fixture \
          npm run test:e2e -- live- --trace retain-on-failure
      - name: Preserve synthetic contract-fixture failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-live-fixture-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Phase 10B.1. The copilot's process-level mode AND the runtime's
  # deployment posture are both fixed when the server boots, so one server
  # cannot show all of them. The spec file is the same in all four jobs;
  # each declares its block via E2E_COPILOT_POSTURE, and together they
  # cover every required browser proof. Nothing is skipped in CI — the
  # guards select a posture, they do not avoid running.
  e2e-copilot-readiness:
    name: Browser suite (copilot provider readiness — live state machine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # This job runs `next dev` (E2E_DEV_SERVER=1), not `next start`.
      # `next start` forces NODE_ENV=production, which the deployed-runtime
      # detector treats as a deployment signal, and a deployed runtime is
      # categorically refused the deterministic provider. Weakening that
      # refusal to obtain coverage is the trade this repository will not
      # make, so the suite moves to a runtime where the local contract
      # fixture is legitimately permitted. The deployed half of the
      # behaviour is proven by e2e-copilot-deployed-live below.
      - name: Live state machine against governed records (local contract fixture)
        run: |
          node scripts/live-stub-server.mjs &
          sleep 2
          E2E_LIVE=1 \
          E2E_DEV_SERVER=1 \
          E2E_COPILOT_POSTURE=live_local \
          APP_EDITION=clinical \
          NEXT_PUBLIC_USE_LIVE_API=true \
          CLINICAL_COPILOT_MODE=live \
          CLINICAL_CONTRACT_FIXTURE=1 \
          TRPC_BASE_URL=http://127.0.0.1:3999/api/trpc \
          CLINICAL_SUPABASE_URL=http://127.0.0.1:3999 \
          CLINICAL_SUPABASE_ANON_KEY=stub \
          CLINICAL_DEMO_EMAIL=demo@local \
          CLINICAL_DEMO_PASSWORD=demo \
          CLINICAL_ORG_ID=org-fixture \
          npm run test:e2e -- live-copilot-provider-readiness

  e2e-copilot-fixture-refusal:
    name: Browser suite (copilot fixture refused in a deployed runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:clinical
      # CLINICAL_COPILOT_MODE=fixture plus THREE deployed-runtime markers,
      # AND CLINICAL_CONTRACT_FIXTURE=1. The point of the job is that none
      # of them — not the client-shipped NEXT_PUBLIC_* one, and not the
      # contract-fixture opt-in either — can re-open the fixture path.
      - name: Fixture mode must refuse, and must not fall back to fixture content
        run: |
          node scripts/live-stub-server.mjs &
          sleep 2
          E2E_LIVE=1 \
          E2E_COPILOT_POSTURE=deployed_fixture \
          APP_EDITION=clinical \
          CLINICAL_COPILOT_MODE=fixture \
          CLINICAL_CONTRACT_FIXTURE=1 \
          APP_RUNTIME_ENV=production \
          NEXT_PUBLIC_APP_ENV=production \
          VERCEL_ENV=production \
          TRPC_BASE_URL=http://127.0.0.1:3999/api/trpc \
          CLINICAL_SUPABASE_URL=http://127.0.0.1:3999 \
          CLINICAL_SUPABASE_ANON_KEY=stub \
          CLINICAL_DEMO_EMAIL=demo@local \
          CLINICAL_DEMO_PASSWORD=demo \
          CLINICAL_ORG_ID=org-fixture \
          npm run test:e2e -- live-copilot-provider-readiness

  e2e-copilot-deployed-live:
    name: Browser suite (governed synthetic refused in a deployed runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:clinical
      # The counterpart to e2e-copilot-readiness. Identical governed
      # records — registry kind `synthetic_fixture`, activation
      # `approved_for_synthetic`, no PHI, CLINICAL_COPILOT_MODE=live,
      # CLINICAL_CONTRACT_FIXTURE=1 — but a deployed runtime. An audited
      # activation row is not a reason for synthetic clinical content to
      # exist in a deployed process, so the run must produce nothing.
      - name: approved_for_synthetic must produce nothing in a deployed runtime
        run: |
          node scripts/live-stub-server.mjs &
          sleep 2
          E2E_LIVE=1 \
          E2E_COPILOT_POSTURE=deployed_live \
          APP_EDITION=clinical \
          CLINICAL_COPILOT_MODE=live \
          CLINICAL_CONTRACT_FIXTURE=1 \
          APP_RUNTIME_ENV=production \
          VERCEL_ENV=production \
          TRPC_BASE_URL=http://127.0.0.1:3999/api/trpc \
          CLINICAL_SUPABASE_URL=http://127.0.0.1:3999 \
          CLINICAL_SUPABASE_ANON_KEY=stub \
          CLINICAL_DEMO_EMAIL=demo@local \
          CLINICAL_DEMO_PASSWORD=demo \
          CLINICAL_ORG_ID=org-fixture \
          npm run test:e2e -- live-copilot-provider-readiness

  e2e-deployed:
    name: Browser suite (deployed backend — gated on secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: gate
        name: Check deployed-backend secrets
        env:
          HAS: ${{ secrets.DEPLOYED_TRPC_BASE_URL != '' && secrets.DEPLOYED_CLINICAL_SUPABASE_URL != '' }}
        run: echo "run=$HAS" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.gate.outputs.run == 'true'
        run: npm run build:clinical
      - if: steps.gate.outputs.run == 'true'
        name: Run gated live suite against the DEPLOYED backend
        env:
          TRPC_BASE_URL: ${{ secrets.DEPLOYED_TRPC_BASE_URL }}
          CLINICAL_SUPABASE_URL: ${{ secrets.DEPLOYED_CLINICAL_SUPABASE_URL }}
          CLINICAL_SUPABASE_ANON_KEY: ${{ secrets.DEPLOYED_CLINICAL_SUPABASE_ANON_KEY }}
          CLINICAL_DEMO_EMAIL: ${{ secrets.DEPLOYED_CLINICAL_DEMO_EMAIL }}
          CLINICAL_DEMO_PASSWORD: ${{ secrets.DEPLOYED_CLINICAL_DEMO_PASSWORD }}
          CLINICAL_ORG_ID: ${{ secrets.DEPLOYED_CLINICAL_ORG_ID }}
        run: E2E_LIVE=1 APP_EDITION=clinical npm run test:e2e -- e2e/live-tasks.spec.ts
      - if: steps.gate.outputs.run != 'true'
        run: echo "Deployed-backend secrets not configured — job skipped (fixture suite still ran)."
